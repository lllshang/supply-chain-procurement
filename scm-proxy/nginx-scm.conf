# ============================================================
# scm.16u.cc SPA 深链 404 修复 —— 本地反向代理 shim
# ------------------------------------------------------------
# 原理：
#   1. 本机 nginx 监听 80/443，server_name = scm.16u.cc
#   2. /etc/hosts 把 scm.16u.cc 指向 127.0.0.1，流量进本机 nginx
#   3. nginx 反代到真实服务器 120.76.140.250（用 IP，避免回路）
#   4. 无扩展名的 SPA 路由若上游返回 404，则回退到 /index.html
#   5. 浏览器看到的 host 仍是 scm.16u.cc，登录 Cookie 不受影响
# ============================================================

# HTTP -> HTTPS 重定向（HSTS 通常已强制，此为兜底）
server {
    listen 80;
    server_name scm.16u.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name scm.16u.cc;

    ssl_certificate     /opt/homebrew/etc/nginx/ssl/scm.16u.cc.pem;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/scm.16u.cc-key.pem;

    # 常见 API 前缀：直连上游，不做 SPA 回退（防止 API 404 被误判成页面）
    # 若你们系统的接口前缀不在列表里，在此追加即可（例如 |order|report）
    location ~ ^/(api|apis|rest|graphql|service|services|auth|oauth|upload|file)(/|$) {
        proxy_pass http://120.76.140.250:80;
        proxy_http_version 1.1;
        proxy_set_header Host scm.16u.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA 路由（无文件扩展名）：上游返回 404 时回退到 index.html
    location ~ ^/[^.?]*$ {
        proxy_pass http://120.76.140.250:80;
        proxy_http_version 1.1;
        proxy_set_header Host scm.16u.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_intercept_errors on;
        error_page 404 =200 /__spa_fallback;
    }

    # 静态资源 / 其他：原样反代（含 /assets/、/favicon.svg 等带扩展名路径）
    location / {
        proxy_pass http://120.76.140.250:80;
        proxy_http_version 1.1;
        proxy_set_header Host scm.16u.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 回退目标：取真实服务器的首页（SPA 入口），由前端路由接管路径
    # 注意：proxy_pass 带 URI 不能用于命名 location（nginx 硬性限制），
    # 因此用 internal 精确匹配 location 承载回退，外部无法直接访问。
    location = /__spa_fallback {
        internal;
        proxy_pass http://120.76.140.250/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host scm.16u.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
