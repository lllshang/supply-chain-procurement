server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: supply-chain-backend
  profiles:
    active: dev
  # 启动时自动初始化库表与种子数据（CREATE TABLE IF NOT EXISTS + INSERT IGNORE，可重复执行）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true
  # 时区 / 编码
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  # 数据源（生产由 CI / ConfigMap 注入，覆盖下列值）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/supply_chain?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  # Redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  # 文件上传
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  mvc:
    # 未匹配路由抛出 NoResourceFoundException，交由 GlobalExceptionHandler 统一返回 404（修复 P1-6）
    throw-exception-if-no-handler-found: true

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.dzgylxt.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-prefix: ""
    banner: false

# ---------------- Springdoc OpenAPI 3.1 ----------------
springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  default-flat-param-object: true

# ---------------- 自定义配置 ----------------
app:
  jwt:
    secret: "supply-chain-default-secret-change-me-in-prod-0123456789abcdef"
    access-token-validity-in-seconds: 7200      # 2h
    refresh-token-validity-in-seconds: 1209600  # 14d
    issuer: dzgylxt
    # 白名单（放行，无需 JWT）—— 逗号分隔字符串，由 SecurityConfig 按 "," 解析
    permit-urls: "/api/v1/auth/login,/h5/api/v1/auth/login,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/doc.html,/actuator/**,/error,/favicon.ico"
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: supply-chain
  price:
    # 价格库异常价判定阈值：与近期通过价均价偏离百分比（P3 设计 §1.4 = 20%）
    abnormal-percent: 20
    # P4 R3c：最低价同步标准价开关（默认关，Q12）。开启后订单完成时同 SKU+采购单位+换算口径
    # 的有效订单取最低正数成交价写 sku.standard_price；切换只影响后续订单不回刷历史。
    lowest-price-sync-enabled: false
  receipt:
    # P4 R3b：超收授权比例（默认 0=禁止超收，Q11 最保守口径 PRD L793）。
    # 到货数量 > 订单剩余可收时：0 直接拒绝；>0 且超收比例 ≤ 阈值须持 receipt:over-receive 权限放行。
    over-receive-percent: 0
  order:
    # D14 日常采购「授权」控制开关（默认开启）
    daily-auth-enabled: true
    # D14 单笔授权额度阈值（元）。超过则升级至部门负责人/采购负责人确认。
    # ⚠️ 占位值，待业务拍板（对应主流程 docx 控制规则表"单笔授权额度"，docx 未给具体数值）
    daily-auth-limit: 500000
    # D17 高频补货自动通过授权（主流程 docx：普通高频补货且价格、数量固定，可按配置自动通过授权校验）
    # 默认关：开启后日常采购(applyId==null)跳过 DAILY_AUTH 人工升级任务，仍保留授权留痕；合同/预算闸不跳过
    daily-auto-auth-enabled: false
  redis:
    # 登录用户缓存前缀
    user-token-prefix: "USER:TOKEN:"
    lock-prefix: "LOCK:"
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174,http://localhost:8081,http://127.0.0.1:80"
    allowed-methods: "*"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  supplier:
    # 资质到期预警提前天数（R-SUP-04，默认 30）
    qual-warn-days: 30

logging:
  level:
    com.dzgylxt: debug
    org.springframework.security: info
